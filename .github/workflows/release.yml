name: Release

# Run from the Actions tab with a version (e.g. 1.1.0). SwiftPM needs the tagged
# commit's Package.swift to hold the XCFramework's url and checksum, so this
# workflow builds the framework first, commits the updated Package.swift, then
# creates the v<version> tag itself.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.1.0'
        required: true

jobs:
  build-and-publish:
    runs-on: macos-15
    permissions:
      contents: write
      packages: write

    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}

    steps:
    - uses: actions/checkout@v4
      with:
        ref: main

    - name: Check version and tag
      run: |
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Version must look like 1.2.3"
          exit 1
        fi
        if git ls-remote --exit-code --tags origin "$TAG" >/dev/null; then
          echo "::error::Tag $TAG already exists"
          exit 1
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Run tests
      run: ./gradlew jvmTest

    - name: Build XCFramework
      run: |
        ./gradlew assembleCompressGpsReleaseXCFramework
        cd build/XCFrameworks/release
        zip -qry CompressGps.xcframework.zip CompressGps.xcframework

    - name: Publish to GitHub Packages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: ./gradlew publish

    - name: Point Package.swift at this release and tag it
      run: |
        CHECKSUM=$(swift package compute-checksum build/XCFrameworks/release/CompressGps.xcframework.zip)
        URL="https://github.com/sprintf/compress-gps/releases/download/$TAG/CompressGps.xcframework.zip"
        sed -i '' -E "s|url: \"[^\"]*\"|url: \"$URL\"|; s|checksum: \"[^\"]*\"|checksum: \"$CHECKSUM\"|" Package.swift
        git config user.name "github-actions[bot]"
        git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
        git commit -am "Release $VERSION"
        git tag "$TAG"
        git push origin main "$TAG"

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "$TAG" \
          --title "Release $VERSION" \
          --generate-notes \
          --notes "$(cat <<EOF
        ## compress-gps Release $VERSION

        ### Android / JVM
        \`\`\`kotlin
        dependencies {
            implementation("com.normtronix:compress-gps:$VERSION")
        }
        \`\`\`

        ### iOS (Swift Package Manager)
        \`\`\`swift
        .package(url: "https://github.com/sprintf/compress-gps.git", from: "$VERSION")
        \`\`\`
        EOF
        )" \
          build/XCFrameworks/release/CompressGps.xcframework.zip \
          build/libs/compress-gps-jvm-*.jar
