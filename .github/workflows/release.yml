name: Release

# Runs when a release is published from the GitHub Releases page with a tag like
# v1.2.0. SwiftPM needs the tagged commit's Package.swift to hold the
# XCFramework's url and checksum, which only exist after the build, so this
# workflow commits them on top of the tagged commit and moves the tag there.
# main keeps the placeholder values.
#
# It can also be started from the Actions tab for an existing release tag,
# e.g. to finish a release whose run failed.

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. v1.2.0'
        required: true

jobs:
  build-and-publish:
    runs-on: macos-15
    permissions:
      contents: write
      packages: write

    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.TAG }}

    - name: Check tag
      run: |
        if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Release tag must look like v1.2.3 (SwiftPM can't read '$TAG')"
          exit 1
        fi
        echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Run tests
      run: ./gradlew jvmTest

    - name: Build XCFramework
      run: |
        ./gradlew assembleCompressGpsReleaseXCFramework
        cd build/XCFrameworks/release
        zip -qry CompressGps.xcframework.zip CompressGps.xcframework

    - name: Publish to GitHub Packages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: ./gradlew publish

    - name: Attach files to the release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload "$TAG" --clobber \
          build/XCFrameworks/release/CompressGps.xcframework.zip \
          build/libs/compress-gps-jvm-*.jar

    - name: Point Package.swift at this release and move the tag
      run: |
        CHECKSUM=$(swift package compute-checksum build/XCFrameworks/release/CompressGps.xcframework.zip)
        URL="https://github.com/sprintf/compress-gps/releases/download/$TAG/CompressGps.xcframework.zip"
        sed -i '' -E "s|url: \"[^\"]*\"|url: \"$URL\"|; s|checksum: \"[^\"]*\"|checksum: \"$CHECKSUM\"|" Package.swift
        git config user.name "github-actions[bot]"
        git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
        git commit -am "Swift package for $TAG"
        git tag -f "$TAG"
        git push -f origin "refs/tags/$TAG"
